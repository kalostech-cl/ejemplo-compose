# Ejemplo de un tenant con varios contenedores. En kosmos se traduce con
# pantheon/scripts/new-tenant.py --compose (ver pantheon/docs/features/tenants-compose.md).
services:
  web:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD:-ejemplo}@db:5432/app
      REDIS_ADDR: cache:6379
    depends_on: [db, cache]
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ejemplo}
    volumes:
      - pgdata:/var/lib/postgresql
  cache:
    image: redis:8
volumes:
  pgdata:
